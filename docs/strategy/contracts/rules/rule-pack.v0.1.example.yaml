# Example rule pack — corrected for D-f (system_id).
#
# WRONG (withdrawn): emitting glycemic_dysregulation against a pancreas region.
# Glucose and HbA1c inform glycemic regulation; they belong to `metabolic`.
# The pancreas is usually not the lesion. Provenance (specimen) ≠ interpretation site.
#
# schema: rule-pack.v0.1.schema.json
schema_version: rule-pack.v0.1
pack_id: open-twin.example.glycemic
description: Minimal example — glycemic family only.

rules:
  - id: glycemic_dysregulation
    family: glycemic
    description: Fasting glucose and/or HbA1c outside the interval they were measured against.
    clinical_basis: heuristic_no_guideline
    rule_strength: 0.75
    emit: state
    system_id: metabolic
    geometry:
      fma_id: "FMA:9637"
      uberon_id: "UBERON:0002107"
    inputs:
      - biomarker_id: BM-128
        role: required
      - biomarker_id: BM-139
        role: optional
    severity_ladder:
      - severity: marked
        when:
          predicate: ratio_to_high_at_least
          input: BM-139
          factor: 1.3
      - severity: mild
        when:
          predicate: above_high
          input: BM-128
      - severity: mild
        when:
          predicate: above_high
          input: BM-139
      - severity: none
        when:
          predicate: within_interval
          input: BM-128
          require_all_required_present: true
      - severity: indeterminate
        when:
          predicate: any_present_outside
