<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="878" viewBox="0 0 1000 878" role="img" aria-labelledby="title desc">
<title id="title">How open-twin moves health data</title>
<desc id="desc">Nine sources (Oura, WHOOP, Google Health, OpenWearables, VITRONIC BodyLoop, FHIR R4 records, HL7 v2 messages, VCF genome variants and Anchor lab biomarkers) each pass through their own connector, then through a shared FHIR contract for identity, codes and units, into a FHIR R4 bundle. Bundles are checked on every pull request by terminology, UCUM and the HL7 validator. Bundles are reconciled into one per person. Lab biomarkers are interpreted against the Anchor layer and a rule pack, and the result is shown per body system in the open-twin-xr viewer.</desc>
