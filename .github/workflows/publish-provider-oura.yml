name: Publish provider-oura

on:
  push:
    branches:
      - '**'
    paths:
      - 'packages/provider-oura/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish package to npm?'
        type: boolean
        required: true
        default: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint provider-oura
        working-directory: packages/provider-oura
        run: pnpm run lint

      - name: Test provider-oura
        working-directory: packages/provider-oura
        run: pnpm run test
      
      - name: Create test report
        uses: dorny/test-reporter@v2
        if: success() || failure()
        with:
          name: Unit Test Results
          path: './packages/*/*.junit.xml'
          reporter: java-junit

      - name: Build provider-oura
        working-directory: packages/provider-oura
        run: pnpm run build

      - name: Publish package
        # Only run if triggered manually AND the publish checkbox was checked
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
        working-directory: packages/provider-oura
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}