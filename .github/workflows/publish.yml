# One workflow for all packages.
#
# This replaces three near-identical files (publish-provider-oura.yml,
# publish-provider-google.yml, publish-provider-vitronic.yml) that were 86.4%
# byte-identical, with the package name as the only variation and no per-package
# logic at all. They had already drifted, and each uploaded `./packages/*/*.junit.xml`
# so every run published the other packages' test reports as its own.
#
# Publication still requires a manual workflow_dispatch with an explicit checkbox.

name: Publish

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
  pull_request:
    paths:
      - 'packages/**'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        type: choice
        required: true
        options:
          - '@open-twin/fhir-core'
          - '@open-twin/provider-oura'
          - '@open-twin/provider-google-health'
          - '@open-twin/provider-vitronic'
      publish:
        description: 'Publish package to npm?'
        type: boolean
        required: true
        default: false

# Least privilege by default. Without this block GITHUB_TOKEN inherits the
# repository default, which is broader than any job here needs.
permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # dorny/test-reporter publishes a check run
    strategy:
      fail-fast: false
      matrix:
        package: [fhir-core, provider-oura, provider-google-health, provider-vitronic]
    steps:
      # Third-party actions are pinned to commit SHAs. A tag is mutable, and these
      # run in the same workflow that holds the npm publish token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: npx vitest run --reporter=junit --outputFile=test.junit.xml

      - name: Test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: success() || failure()
        with:
          name: ${{ matrix.package }} tests
          # Scoped to this package. Previously every job uploaded every package's
          # report, so all three published each other's results.
          path: 'packages/${{ matrix.package }}/test.junit.xml'
          reporter: java-junit

      - name: Build ${{ matrix.package }}
        run: pnpm --filter "@open-twin/${{ matrix.package }}..." build

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "${{ inputs.package }}..." build

      - name: Publish ${{ inputs.package }}
        run: pnpm --filter "${{ inputs.package }}" publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
