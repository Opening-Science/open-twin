version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /packages/*
      - /scripts
      - /tools
      - /verify
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    open-pull-requests-limit: 50

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
