      - severity: moderate
        when: { predicate: ratio_to_high_at_least, input: BM-128, factor: 1.5 }
      - severity: mild
        when: { predicate: above_high, input: BM-139 }
      - severity: mild
        when: { predicate: above_high, input: BM-128 }
      - severity: none
        when: { predicate: within_interval, input: BM-128, require_all_required_present: true }
      - severity: indeterminate
        when: { predicate: any_present_outside }

