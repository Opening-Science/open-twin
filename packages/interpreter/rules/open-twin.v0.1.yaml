# OpenTwin rule pack v0.1
# Clinical knowledge lives HERE. The engine is a pure evaluator.
# All clinical_basis values are heuristic_no_guideline — docs/evidence/guidelines/ is empty.
schema_version: rule-pack.v0.1
pack_id: open-twin.v0.1
description: >
  Declarative rules for Anchor-core interpretation. system_id assignments follow
  D-f (nine openXR values) and the family map in the interpreter task — not LOINC System.

rules:
  # ── hepatic → digestive ─────────────────────────────────────────────
  - id: hepatic_hepatocellular
    family: hepatic
    description: Hepatocellular pattern from ALT/AST vs their measured intervals.
    clinical_basis: heuristic_no_guideline
    rule_strength: 0.7
    emit: state
    system_id: digestive
    geometry:
      fma_id: "FMA:7197"
      uberon_id: "UBERON:0002107"
    inputs:
      - biomarker_id: BM-132
        role: required
      - biomarker_id: BM-130
        role: optional
    severity_ladder:
      - severity: marked
        when: { predicate: ratio_to_high_at_least, input: BM-132, factor: 5 }
      - severity: moderate
        when: { predicate: ratio_to_high_at_least, input: BM-132, factor: 3 }
      - severity: mild
        when: { predicate: above_high, input: BM-132 }
      - severity: mild
        when: { predicate: above_high, input: BM-130 }
      - severity: none
        when: { predicate: within_interval, input: BM-132, require_all_required_present: true }
      - severity: indeterminate
        when: { predicate: any_present_outside }

  - id: hepatic_cholestatic
    family: hepatic
    description: >
      Cholestatic pattern. Alkaline phosphatase is NOT in the Anchor core set, so
      this rule is capped at severity=indeterminate and confidence<=0.4. GGT alone
      cannot complete the pattern. Do not substitute another marker for ALP.
    clinical_basis: heuristic_no_guideline
    rule_strength: 0.55
    emit: state
    system_id: digestive
    geometry:
      fma_id: "FMA:7197"
      uberon_id: "UBERON:0002107"
    gap_notes: ALP absent from Anchor core set — rule capped.
    caps:
      max_severity: indeterminate
      max_confidence: 0.4
    inputs:
      - biomarker_id: BM-123
        role: required
    severity_ladder:
      - severity: indeterminate
        when: { predicate: above_high, input: BM-123 }
      - severity: indeterminate
        when: { predicate: within_interval, input: BM-123, require_all_required_present: true }
      - severity: indeterminate
        when: { predicate: any_present_outside }

